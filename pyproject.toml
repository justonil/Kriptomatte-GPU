[project]
name = "kriptomatte-phase-1"
version = "0.0.14"
description = "Decode Cryptomattes in EXR file to PNG masks."
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
  "numpy",
  "pillow",
  "openexr",
  "imath",
]

[project.optional-dependencies]
# Optional GPU acceleration for the mask computation stage (NVIDIA + CUDA).
# Match the wheel to the installed CUDA Toolkit: cupy-cuda12x / cupy-cuda13x.
gpu = [
  "cupy-cuda13x",
]

[project.urls]
Homepage = "https://github.com/Risiamu/Kriptomatte-Phase-1"
Issues = "https://github.com/Risiamu/Kriptomatte-Phase-1/issues"
